<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopify Logo Background -->
  <rect width="100" height="100" rx="10" fill="#96bf48"/>
  
  <!-- Shopify Shopping Bag Icon -->
  <g transform="translate(25, 25)">
    <!-- Bag Body -->
    <path d="M10 20 L10 45 Q10 50 15 50 L35 50 Q40 50 40 45 L40 20 L10 20 Z" 
          fill="white" stroke="none"/>
    
    <!-- Bag Handle -->
    <path d="M15 20 C15 15 20 10 25 10 C30 10 35 15 35 20" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shopify "S" Symbol -->
    <text x="25" y="38" font-family="Arial, sans-serif" font-size="20" 
          font-weight="bold" text-anchor="middle" fill="#96bf48">S</text>
  </g>
</svg>